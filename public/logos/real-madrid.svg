    <path d="M50 70 L150 170 L170 150 L70 50 Z" fill="#6366f1" opacity="0.9"/>
  </g>
  <!-- Inner Ring -->
  <circle cx="100" cy="118" r="52" fill="none" stroke="url(#rmGold)" stroke-width="2"/>
  <!-- Monogram text MCF -->
  <text x="100" y="126" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#rmGold)" text-anchor="middle" letter-spacing="1">RMA</text>
  <text x="100" y="146" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="10" fill="#1e3a8a" text-anchor="middle">REAL MADRID</text>
