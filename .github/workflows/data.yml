name: Refresh TV data

# Rebuilds the files the TV app downloads (on-demand catalog, programme guide) once a day
# and publishes them to the gh-pages branch. Scheduled runs only happen from the default branch.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tv-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build on-demand catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/catalog/build-catalog.js out/data published/data/catalog.json

      - name: Build programme guide
        continue-on-error: true
        run: |
          if [ -f scripts/epg/build-epg.js ]; then
            node scripts/epg/build-epg.js out/data
          fi

      - name: Publish
        run: |
          mkdir -p published/data
          cp out/data/* published/data/
          cp hosted/yt.html published/yt.html
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh TV data"
            git push
          fi
